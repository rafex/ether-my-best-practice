site_name: Ether My Best Practice
site_description: Mejores prácticas y estándares para desarrollo de software
site_author: Raúl González
site_email: rafex@rafex.dev

docs_dir: ../../docs
site_dir: ../../site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  language: es

nav:
  - Inicio: index.md
  - Guía de Inicio: getting-started.md
  - Contribuyendo: contributing.md
  - Descargar el MCP: mcp.md
  - Instalar el MCP: mcp-install.md
  - Reglas:
      - Índice: rules/00-index.md
      - Herramientas de Construcción: rules/01-build-tooling.md
      - Arquitectura: rules/02-architecture_draft.md
      - Testing: rules/03-testing_draft.md
      - Documentación: rules/04-documentation_draft.md
      - Control de Versiones: rules/05-version-control_draft.md
      - CI: rules/06-ci.md
      - Agentes IA y MCP: rules/07-agents-mcp.md
      - Stack Tecnológico: rules/08-stack.md
      - Estructura de Repositorio: rules/09-repository-structure.md
      - Git Hooks: rules/10-githooks.md
      - Commitizen: rules/11-commitizen.md
      - Gitignore: rules/12-gitignore.md
      - Gestión de Secretos: rules/13-secrets.md
      - Archivos de Configuración: rules/14-config-files.md
      - Reutilización de Scripts: rules/15-script-reuse.md
      - Despliegue Continuo: rules/16-cd.md

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - codehilite
  - extra
  - tables
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
