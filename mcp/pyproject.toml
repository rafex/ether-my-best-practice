[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ether-mcp-my-best-practices"
version = "1.0.0"
description = "MCP server que expone las reglas y templates de Ether Best Practices como Resources, Tools y Prompts para agentes de IA"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "PyYAML>=6.0",
]
license = {text = "MIT"}
authors = [
    {name = "Rafael Exner", email = "rafex@example.com"},
]
keywords = ["mcp", "model-context-protocol", "ether", "best-practices", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
ether-mcp = "ether_mcp_my_best_practices.server:main"

[tool.hatch.build.targets.wheel]
packages = ["ether_mcp_my_best_practices"]

[tool.hatch.build.targets.sdist]
include = [
    "ether_mcp_my_best_practices/**",
    "README.md",
]
