name: Validar y publicar documentación

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r .config/mkdocs/requirements.txt
          pip install PyYAML

      - name: Validate rules
        run: make validate

      - name: Build site
        run: make docs

      - name: Publish ether-rules content + checksums
        run: make publish-checksums

      - name: Verify published manifest
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "helpers/python/lib")
          from commons import content_hash

          manifest = json.load(open("site/ether-rules/checksums.json"))
          files = manifest["files"]
          if not files:
              sys.exit("manifest vacío")
          for rel in ("rules/01-build-tooling.md", "rules/00-index.md"):
              with open(f"site/ether-rules/{rel}", encoding="utf-8") as f:
                  text = f.read()
              assert content_hash(rel, text) == files[rel], f"checksum mismatch: {rel}"
          print(f"OK: manifest válido ({len(files)} archivos), checksum de reglas correcto")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
